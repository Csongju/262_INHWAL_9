    <h1>D-Day 계산기</h1>
    <p><code>Date</code> 객체로 오늘부터 목표 날짜까지 남은 날을 계산합니다.</p>
  </header>

  <section class="lab">
    <h2>Date 객체 활용: D-Day 계산 결과</h2>

    <script>
      // 3. 오늘 날짜 객체 생성
      let now = new Date();

      // 4. prompt()로 연, 월, 일을 문자열로 입력받기
      let yearStr = prompt("목표 연도를 입력하세요 (예: 2026)", "2026");
      let monthStr = prompt("목표 월을 입력하세요 (1~12)", "12");
      let dayStr = prompt("목표 일을 입력하세요 (1~31)", "25");

      // 5. 취소했거나 비어 있으면 계산하지 않음
      if (!yearStr || !monthStr || !dayStr) {
        document.write('<div class="result cancel"><p class="caption">계산을 취소했습니다.</p></div>');
      } else {
        // 6. parseInt()로 문자열 → 숫자 변환
        let year = parseInt(yearStr);
        let month = parseInt(monthStr);
        let day = parseInt(dayStr);

        // 7. 목표 날짜 객체 생성
        //    Date 객체의 월은 0부터 셉니다 (0=1월, 1=2월, ... 11=12월).
        //    사람이 입력한 월(1~12)에서 1을 빼야 Date가 이해하는 월(0~11)이 됩니다.
        let targetDate = new Date(year, month - 1, day);

        // 7-1. 있을 수 없는 날짜 걸러내기
        //    Date는 잘못된 날짜를 에러 없이 "넘겨서" 고칩니다.
        //    예) 2월 30일 → 3월 2일, 13월 → 다음 해 1월
        //    그래서 만들어진 날짜의 연·월·일이 입력값과 똑같은지 다시 확인합니다.
        //    (숫자가 아닌 값을 넣어 NaN이 된 경우도 여기서 걸러집니다)
        let isValid = targetDate.getFullYear() === year &&
                      targetDate.getMonth() === month - 1 &&
                      targetDate.getDate() === day;

        if (!isValid) {
          document.write('<div class="result cancel">');
          document.write('<p class="caption">존재하지 않는 날짜입니다.</p>');
          document.write('<ul class="dates"><li><strong>입력한 값</strong>' +
                         yearStr + '년 ' + monthStr + '월 ' + dayStr + '일</li></ul>');
          document.write('</div>');
        } else {

          // 8. 두 날짜의 밀리초 차이
          let diffMs = targetDate.getTime() - now.getTime();

          // 9. 밀리초 → 일 단위로 변환 후 올림
          let diffDay = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

          // 10. 결과 출력 (D-Day / D- / D+)
          document.write('<div class="result">');
          if (diffDay === 0) {
            document.write('<p class="big today">D-Day</p>');
            document.write('<p class="caption">D-Day 입니다!</p>');
          } else if (diffDay > 0) {
            document.write('<p class="big">D-' + diffDay + '</p>');
            document.write('<p class="caption">' + diffDay + '일 남았습니다.</p>');
          } else {
            document.write('<p class="big">D+' + Math.abs(diffDay) + '</p>');
            document.write('<p class="caption">' + Math.abs(diffDay) + '일 지났습니다.</p>');
          }
          document.write('<ul class="dates">');
          document.write('<li><strong>목표 날짜</strong>' + targetDate.toLocaleDateString() + '</li>');
          document.write('<li><strong>오늘 날짜</strong>' + now.toLocaleString() + '</li>');
          document.write('</ul>');
          document.write('</div>');
        } // 7-1의 else 끝
      }
    </script>

    <p class="hint">새로고침(F5)을 누르면 다시 계산할 수 있습니다.</p>

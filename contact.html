<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | 추송주</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="sb-top">
    <a class="brand" href="home.html">추송주<span>.</span></a>
    <p class="sb-role">광운대학교 소프트웨어학부 23학번</p>
    <button class="menu-btn" id="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">☰</button>
  </div>
  <nav>
    <a href="home.html"><small>01</small>Home</a>
    <a href="about.html"><small>02</small>About</a>
    <a href="portfolio.html"><small>03</small>Portfolio</a>
    <a href="contact.html" aria-current="page"><small>04</small>Contact</a>
  </nav>
  <div class="sb-foot">
    <small>&copy; <span id="year"></span> 추송주</small>
  </div>
</aside>

<main class="content">
  <header class="page-head">
    <span class="page-no">04 · Contact</span>
    <h1><em>연락</em>하기</h1>
    <p>궁금한 점이 있다면 편하게 연락 주세요.</p>
  </header>

  <section class="block reveal">
    <h2>연락처</h2>
    <ul class="info-list contact-list">
      <li>
        <span class="label">이메일</span>
        <span>
          <a href="mailto:choosongju23@gmail.com">choosongju23@gmail.com</a>
          <button class="copy-btn" type="button" data-copy="choosongju23@gmail.com">복사</button>
        </span>
      </li>
      <li>
        <span class="label">GitHub</span>
        <a href="https://github.com/Csongju" target="_blank" rel="noopener">Csongju ↗</a>
      </li>
    </ul>
  </section>

  <section class="block reveal">
    <h2>메시지 보내기</h2>
    <!-- 보내기를 누르면 입력값을 확인한 뒤 메일 앱이 열립니다 (script.js 5번) -->
    <form class="contact-form" data-to="choosongju23@gmail.com" novalidate>
      <label for="name">이름</label>
      <input id="name" name="name" type="text" placeholder="이름을 입력하세요">
      <label for="message">메시지</label>
      <textarea id="message" name="message" rows="5" placeholder="메시지를 입력하세요"></textarea>
      <button class="btn" type="submit">보내기 ✉️</button>
      <p class="form-msg" role="status"></p>
    </form>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
